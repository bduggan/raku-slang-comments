name: Linux

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    env:
      RAKUDO_RAKUAST: 1
    strategy:
      matrix:
        os:
          - ubuntu-latest
        raku-version:
          - '2026.06'
          - 'latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - name: Install Dependencies
        run: zef install --deps-only .
      - name: Run Tests
        run: ./make -v test
